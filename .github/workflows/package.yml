name: Package

# The Python package. Build and publish are separate jobs on purpose: the artifact that
# gets published is the one that was built and inspected, and a failed publish never
# silently rebuilds from a different tree.
#
# A release is installed back out of a package index before PyPI sees it. Publishing to
# PyPI cannot be undone and yanking is deliberately manual — Warehouse exposes it only
# through the web UI, behind a re-authentication challenge — so the last chance to catch a
# bad artifact has to come before the irreversible step, not after it.
#
# That index is served locally rather than being TestPyPI. TestPyPI refuses the name: it
# already carries a `chatroom`, and Warehouse rejects any name whose separators normalize
# onto an existing one. Rehearsing under a different name would rehearse a different
# artifact, which is worse than not rehearsing at all. A local index needs no account, has
# no propagation lag, and exercises the same path that matters — resolving a name and a
# version over HTTP instead of being handed a file.
#
# Publishing needs Trusted Publishing configured once for this repository and the workflow
# filename `package.yml`, with a GitHub environment named `pypi`. Until that exists the
# build job still runs on every tag and only publishing fails.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to PyPI as well as building
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # The version is read from the program itself, so a tag that disagrees with it
      # would publish something other than what it claims to be.
      - name: Hold the tag to the version the program reports
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          declared=$(python -c "import re,pathlib; print(re.search(r'^VERSION = \"([^\"]+)\"', pathlib.Path('plugins/chat-room/scripts/room.py').read_text(), re.M).group(1))")
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$declared" != "$tagged" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION $declared in room.py"
            exit 1
          fi
          echo "Building chat-room $declared"

      - run: python -m pip install --disable-pip-version-check build twine
      - run: python -m build

      # A wheel that imports is not the same as a wheel that carries its data files.
      #
      # This compares the wheel against the repository rather than against a threshold.
      # 0.7.0 shipped without one of its two skills because the check here asked whether
      # *any* skill was present, which is true when half of them are missing.
      - name: Check the wheel carries every non-Python file the plugin ships
        run: |
          python -m twine check dist/*
          python - <<'PY'
          import glob, pathlib, zipfile, sys
          wheel = glob.glob("dist/*.whl")[0]
          packed = set(zipfile.ZipFile(wheel).namelist())
          source = pathlib.Path("plugins/chat-room")
          expected = {
              f"chat_room/{path.relative_to(source).as_posix()}"
              for path in source.rglob("*")
              if path.is_file() and path.suffix != ".py" and "__pycache__" not in path.parts
          }
          missing = sorted(expected - packed)
          if missing:
              sys.exit(f"{wheel} is missing {len(missing)} file(s) the repository ships:\n  " + "\n  ".join(missing))
          print(f"{wheel} carries all {len(expected)} data files:")
          for name in sorted(expected):
              print(f"  {name}")
          PY

      # Installing from the built wheel is the only way to know the console script and
      # its data files survived packaging.
      - name: Run the command from the built wheel
        run: |
          python -m venv /tmp/probe
          /tmp/probe/bin/pip install --disable-pip-version-check "$(ls dist/*.whl)"
          /tmp/probe/bin/chat-room --version
          /tmp/probe/bin/chat-room doctor

      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  verify:
    name: install it out of an index and run it
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/

      # Everything up to here handed pip a file path. This makes it resolve a name and a
      # version out of an index over HTTP, which is what a user's install actually does.
      - name: Serve the distributions as a PEP 503 index
        run: |
          python - <<'SCRIPT'
          import html, pathlib
          root = pathlib.Path("index/simple/chat-room")
          root.mkdir(parents=True)
          links = []
          for artifact in sorted(pathlib.Path("dist").iterdir()):
              (root / artifact.name).write_bytes(artifact.read_bytes())
              links.append(f'<a href="{html.escape(artifact.name)}">{html.escape(artifact.name)}</a><br>')
          root.joinpath("index.html").write_text("<!DOCTYPE html><html><body>" + "".join(links) + "</body></html>")
          pathlib.Path("index/simple/index.html").write_text(
              '<!DOCTYPE html><html><body><a href="chat-room/">chat-room</a></body></html>')
          print("serving:", [item.name for item in sorted(root.iterdir())])
          SCRIPT
          (cd index && nohup python -m http.server 8899 >/dev/null 2>&1 &)
          for _ in $(seq 1 20); do
            curl -sf http://127.0.0.1:8899/simple/chat-room/ >/dev/null && exit 0
            sleep 0.5
          done
          echo "::error::the local index never came up"; exit 1

      - name: Install by name and version, from that index and nothing else
        run: |
          version=$(ls dist/*.whl | sed -E 's/.*chat_room-([^-]+)-.*/\1/')
          echo "resolving chat-room==$version from the local index"
          python -m venv /tmp/rehearsal
          /tmp/rehearsal/bin/pip install --disable-pip-version-check \
            --index-url http://127.0.0.1:8899/simple/ "chat-room==$version"
          /tmp/rehearsal/bin/chat-room --version
          /tmp/rehearsal/bin/chat-room doctor

      - name: Confirm the installed copy still carries its data files
        run: |
          /tmp/rehearsal/bin/python - <<'SCRIPT'
          import pathlib, chat_room
          root = pathlib.Path(chat_room.__file__).parent
          skills = sorted(item.parent.name for item in root.rglob("SKILL.md"))
          missing = [name for name in (".mcp.json", "hooks/hooks.json", ".codex-plugin/plugin.json") if not (root / name).exists()]
          print("skills:", skills)
          assert skills, "the installed package carries no skills"
          assert not missing, f"the installed package is missing {missing}"
          SCRIPT

  publish:
    name: publish to PyPI
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/chat-room
    permissions:
      id-token: write  # Trusted Publishing. No API token is stored anywhere.
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
