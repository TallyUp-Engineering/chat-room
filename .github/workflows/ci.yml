name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  room:
    # The room is claimed to run on macOS, Linux and Windows, so it is tested on all
    # three. Windows is advisory until the platform work lands — it reports the truth
    # rather than being left untested, and becomes blocking once it is green.
    name: room (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.advisory }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            advisory: false
          - os: macos-latest
            advisory: false
          - os: windows-latest
            advisory: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The transcript index is optional, so both paths have to hold: the suite must
      # pass with nothing installed, and again with the extras present.
      - run: python -m unittest discover -s tests -p 'test_room.py' -v
      - run: python -m pip install --disable-pip-version-check -r requirements-index.txt
      - run: python -m unittest discover -s tests -p 'test_room.py' -v

  web:
    name: site and manifests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: python -m json.tool plugins/chat-room/.codex-plugin/plugin.json >/dev/null
      - run: python -m json.tool .agents/plugins/marketplace.json >/dev/null
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev
