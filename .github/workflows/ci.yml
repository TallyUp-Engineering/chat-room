name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python3 -m unittest discover -s tests -p 'test_room.py' -v
      - run: python3 -m json.tool plugins/chat-room/.codex-plugin/plugin.json >/dev/null
      - run: python3 -m json.tool .agents/plugins/marketplace.json >/dev/null
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev
